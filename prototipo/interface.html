<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>PT-MCP local</title>
<style>body{font:13px sans-serif;margin:10px}pre{background:#eee;padding:6px}</style></head>
<body>
<h3>PT-MCP local (prototipo)</h3>
<pre id="diag"></pre>
<pre id="log"></pre>
<script>
// Esta pagina SOLO habla HTTP con el servidor local. El Script Engine de PT la
// consulta con evaluateJavaScript("__take()") y le devuelve el resultado con
// evaluateJavaScript("__result(id,'...')"). $se/webView no existen en paginas http.
var pending = [];            // [{id, code}]
var served = 0, finished = 0;

function log(s) {
  var el = document.getElementById("log");
  el.textContent = (s + "\n" + el.textContent).substring(0, 2000);
  document.getElementById("diag").textContent =
    "XMLHttpRequest: " + typeof XMLHttpRequest + "\nrecibidos: " + served + "  terminados: " + finished;
}

// Lo llama el Script Engine: devuelve "id:codigoCodificado" o "" si no hay nada.
function __take() {
  if (pending.length === 0) { return ""; }
  var c = pending.shift();
  served++;
  log("#" + c.id + " <- " + c.code.substring(0, 160));
  return c.id + ":" + encodeURIComponent(c.code);
}

// Lo llama el Script Engine con el resultado codificado.
function __result(id, enc) {
  var res = decodeURIComponent(enc);
  finished++;
  var x = new XMLHttpRequest();
  x.open("POST", "/result?id=" + id, true);
  x.send(res);
  log("#" + id + " -> " + res.substring(0, 160));
  return "ok";
}

function poll() {
  var x = new XMLHttpRequest();
  x.open("GET", "/next", true);
  x.timeout = 8000;
  x.onreadystatechange = function () {
    if (x.readyState != 4) { return; }
    if (x.status == 200) {
      var t = x.responseText, i = t.indexOf("\n");
      pending.push({ id: parseInt(t.substring(0, i), 10), code: t.substring(i + 1) });
      setTimeout(poll, 0);
    } else if (x.status == 204) {
      setTimeout(poll, 250);
    } else {
      setTimeout(poll, 1000);
    }
  };
  x.ontimeout = function () { setTimeout(poll, 500); };
  x.send();
}
log("panel listo");
poll();
</script></body></html>
